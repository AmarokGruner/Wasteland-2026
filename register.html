<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasteland - Registrierung</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .register-container {
            background: rgba(20, 20, 20, 0.9);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid var(--border);
            color: white;
            border-radius: 4px;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .links {
            margin-top: 20px;
            font-size: 14px;
        }

        .links a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="register-container">
        <h1>Wasteland</h1>
        <p style="color: grey; margin-bottom: 20px;">Registriere deinen Account</p>
        <form id="registerForm">
            <div class="input-group">
                <label>Benutzername</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label>E-Mail (optional)</label>
                <input type="email" id="email">
            </div>
            <div class="input-group">
                <label>Passwort</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-register">REGISTRIEREN</button>
        </form>
        <div class="links">
            Bereits einen Account? <a href="login.html">Hier einloggen</a>
        </div>
    </div>

    <script src="js/auth-service.js?v=2"></script>
    <script>
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const em = document.getElementById('email').value;

            try {
                await AuthService.register(u, p, em);
                window.location.href = "/";
            } catch (err) {
                alert(err.message);
            }
        };
    </script>
</body>

</html>
