<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbrannte Zone - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a00 0%, #2d1810 50%, #1a0a00 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e8d5c4;
        }

        .login-container {
            background: rgba(45, 24, 16, 0.95);
            border: 2px solid #8b4513;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #cd853f;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .logo p {
            color: #a0522d;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cd853f;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #5c3d2e;
            border-radius: 6px;
            background: #1a0a00;
            color: #e8d5c4;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #cd853f;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: #fff;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #a0522d, #cd853f);
            transform: translateY(-2px);
        }

        .error {
            background: rgba(139, 0, 0, 0.3);
            border: 1px solid #8b0000;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .test-accounts {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #5c3d2e;
        }

        .test-accounts h3 {
            color: #8b4513;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .test-accounts ul {
            list-style: none;
            font-size: 12px;
            color: #a0522d;
        }

        .test-accounts li {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo">
            <h1>🔥 Verbrannte Zone</h1>
            <p>Post-apocalyptic Strategiespiel</p>
        </div>

        <div class="error" id="error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary">Anmelden</button>
        </form>

        <div class="test-accounts">
            <h3>Test-Accounts:</h3>
            <ul>
                <li>fabian / 123456 (Spieler)</li>
                <li>felix / 345678 (Spieler)</li>
                <li>admin / admin (Administrator)</li>
            </ul>
        </div>

        <div style="margin-top: 20px; text-align: center; font-size: 14px;">
            Noch kein Account? <a href="register.html"
                style="color: #cd853f; text-decoration: none; font-weight: bold;">Hier registrieren</a>
        </div>
    </div>

    <script src="js/auth-service.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            try {
                const data = await AuthService.login(username, password);

                // Redirect based on role
                if (data.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                errorEl.textContent = err.message || 'Anmeldung fehlgeschlagen';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>

</html>
