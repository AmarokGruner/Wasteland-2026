details: |
  Endpunkte, die das Frontend direkt nutzt oder erwartet:
  - GET /player/{player_id} (Spieldaten für das Frontend)
  - GET /player/{player_id}/provinzen
  - GET /player/{player_id}/provinzen/{pid}/lager
  - GET /ressourcen
  - GET /vorkommen
  - GET /gebaeude
  - GET /world/provinzen
  Beachte: Diese Endpunkte dienen als Vertrag für das Frontend, Änderungen müssen synchron erfolgen.
