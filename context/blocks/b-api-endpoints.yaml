summary: "Initial API surface: player management, buildings, resources production."
details: |
  Ziel ist es, eine minimale, aber erweiterbare API-Schnittstelle zu definieren:
  - GET /player/{id}
  - POST /player
  - GET /player/{id}/buildings
  - POST /player/{id}/buildings
  - POST /player/{id}/resources/produce
  Diese Endpunkte dienen als Träger für weitere Features (Buildings, Units, Combat).
