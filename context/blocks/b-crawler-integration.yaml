title: "Webcrawler-Integration"
summary: "Webcrawler-API, Crawler-Sessions, Pending Changes Review Workflow"
details: |
  ## Überblick
  Webcrawler-Integration zur automatischen Datenbank-Aktualisierung durch Web-Scraping.
  
  **Workflow:** Start → Scrape → Review → Approve → DB-Sync
  
  ## Datenbank-Tabellen
  **crawl_sessions:**
  - id, started_at, completed_at, status (pending|running|completed|failed)
  - categories JSON, dry_run, total_changes, error_message
  
  **crawl_changes:**
  - id, session_id, category, action (INSERT|UPDATE|REJECT)
  - record_id, table_name, old_data_json, new_data_json
  - changed_fields JSON, approved, rejected
  
  ## API Endpunkte
  POST   /api/admin/crawler/start
  GET    /api/admin/crawler/status
  GET    /api/admin/crawler/results
  POST   /api/admin/crawler/approve/{id}
  POST   /api/admin/crawler/reject/{id}
  GET    /api/admin/crawler/export/csv
  GET    /api/admin/crawler/export/json
  
  ## Kategorien (8)
  Gebäude, Rohstoffe, Vorkommen, Terrains, Lebewesen, Artikel, Einheiten, Regierungsformen
  
  ## Admin-UI
  - Crawler-Tab mit Formular (Kategorien wählen, Dry-Run Toggle)
  - Status-Anzeige (running/completed/failed)
  - Pending-Changes-Tabelle mit Filter und Export
  - Diff-Modal (JSON-Vergleich, Freigabe/Ablehnung)
