title: "UI Guidelines"
domain: "frontend"
summary: "Principles for expressive, accessible, and deliberate UI design."
details: |
  Ziel ist ein konsistentes, hochwertiges UI-Design über alle Seiten hinweg:
  - Typografie, Farben, Layout, Abstände und Interaktion bewusst gestalten
  - Barrierefreiheit (WCAG) berücksichtigen
  - Animationsnutzung sinnvoll und gezielt einsetzen
  - Konsistente Komponenten-Sprache; keine generische Bolster-Wilder-Layouts
