details: |
  World-Endpunkte zur globalen Koordination:
  - GET /world/provinzen: Liste aller Provinzen weltweit (Aggregation über alle Spieler)
  - GET /world/provinzen/{id}: Detailansicht einer spezifischen Provinz (aggregiert, inkl. Terrain)
  - GET /world/vorkommen: Globale Übersicht der Ressourcen-/Vorkommen-Statistiken
  - GET /world/map (optional): Generierte Weltkartenübersicht (falls implementiert)
