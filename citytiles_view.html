<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>City Tiles Viewer</title>
  <link rel="stylesheet" href="/citytiles_view.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    h1 { font-size: 1.25rem; }
    #board { display: grid; grid-template-columns: repeat(15, 28px); grid-template-rows: repeat(15, 28px); gap: 2px; }
    .cell { width: 28px; height: 28px; border: 1px solid #999; box-sizing: border-box; }
    .land { background: #f0e37a; }
    .city-1 { background: #bbb; background-image: linear-gradient(45deg, rgba(0,0,0,.15) 25%, transparent 25%), linear-gradient(-45deg, rgba(0,0,0,.15) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, rgba(0,0,0,.15) 75%), linear-gradient(-45deg, transparent 75%, rgba(0,0,0,.15) 75%); background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0; }
    .city-2 { background: #9e9e9e; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.15) 0 4px, rgba(0,0,0,0) 4px 8px); }
    .city-3 { background: #a0a0a0; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.15) 0 6px, rgba(0,0,0,0) 6px 12px); }
    .city-4 { background: #888; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.15) 0 6px, rgba(0,0,0,0) 6px 12px); }
  </style>
</head>
<body>
  <h1>City Tiles Viewer (Stage 1–4)</h1>
  <div id="board" aria-label="Provinz Stadtfelder"></div>
  <p>Hinweis: Ersetze das Token in der URL oder setze deinen Token in LocalStorage, um die API abzurufen.</p>
  <script src="/js/citytiles_view.js"></script>
</body>
</html>
